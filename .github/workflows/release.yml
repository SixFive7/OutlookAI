name: Build and Release

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  BASE_VERSION: "1.0.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Import signing certificate
        run: |
          $cert = Import-PfxCertificate -FilePath OutlookAI.pfx -CertStoreLocation Cert:\CurrentUser\My
          Write-Host "Imported certificate: $($cert.Thumbprint)"

      - name: Set version
        id: version
        run: |
          $version = "${{ env.BASE_VERSION }}.${{ github.run_number }}"
          echo "FULL_VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Stamp assembly version
        run: |
          $version = "${{ steps.version.outputs.FULL_VERSION }}"
          $file = "Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          Set-Content $file $content
          Write-Host "Stamped version: $version"

      - name: Restore packages
        run: nuget restore OutlookAI.csproj

      - name: Build and Publish
        run: >
          msbuild OutlookAI.csproj
          /target:Publish
          /p:Configuration=Release
          /p:ApplicationVersion=${{ steps.version.outputs.FULL_VERSION }}
          /p:PublishDir=publish\
          /p:BootstrapperEnabled=true
          /p:IsWebBootstrapper=false
          /p:DefineConstants="VSTO40%3BTRACE%3BUseOfficeInterop"

      - name: Create release archive
        run: Compress-Archive -Path publish\* -DestinationPath OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.FULL_VERSION }}
          name: OutlookAI v${{ steps.version.outputs.FULL_VERSION }}
          body: |
            ## OutlookAI v${{ steps.version.outputs.FULL_VERSION }}

            ### Installation
            1. Download `OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.zip`
            2. Extract the zip
            3. Run `setup.exe`

            ### Prerequisites (installed automatically by setup.exe)
            - .NET Framework 4.8
            - Visual Studio Tools for Office Runtime
          files: OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.zip

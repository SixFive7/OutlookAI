name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump as major.minor.patch (e.g. 1.0.0 for major, 0.1.0 for minor, 0.0.1 for patch)'
        required: true
        type: string

permissions:
  contents: write       # push the stamped changelog; create the release and upload the asset
  id-token: write       # OIDC token for build-provenance attestation (Sigstore)
  attestations: write   # record the build-provenance attestation

# Serialize releases so two manual dispatches can't race the push to master.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # windows-latest migrated to a VS 2026 image that dropped the VSTO tooling
    # (Microsoft.VisualStudio.Tools.Applications.Hosting) the ClickOnce signing task needs.
    # Pin to the VS 2022 image, which still ships it.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version bump input
        shell: pwsh
        run: |
          $bump = "${{ inputs.version_bump }}"
          if ($bump -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid version_bump format '$bump'. Must be major.minor.patch (e.g. 1.0.0, 0.1.0, 0.0.1)"
            exit 1
          }
          if ($bump -eq '0.0.0') {
            Write-Error "Version bump 0.0.0 is not valid. Every release must bump at least the patch version (e.g. 0.0.1)."
            exit 1
          }

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match '(?s)## Unreleased\r?\n(.*?)(?=\r?\n## |\z)') {
            $notes = $Matches[1].Trim()
          } else {
            $notes = ""
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "No entries under '## Unreleased' in CHANGELOG.md. Add release notes before creating a release."
            exit 1
          }
          Set-Content -Path release_notes.txt -Value $notes
          Write-Host "Release notes:`n$notes"

      - name: Apply version bump
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bump = "${{ inputs.version_bump }}"
          $parts = $bump -split '\.'
          $bumpMajor = [int]$parts[0]
          $bumpMinor = [int]$parts[1]
          $bumpPatch = [int]$parts[2]

          # Get current base version from the latest GitHub release tag
          $tag = gh release view --json tagName -q .tagName 2>$null
          if ($tag -match '^v?(\d+\.\d+\.\d+)') {
            $current = $Matches[1]
          } else {
            $current = "0.0.0"
          }
          $cv = $current -split '\.'
          $newMajor = [int]$cv[0] + $bumpMajor
          $newMinor = if ($bumpMajor -gt 0) { $bumpMinor } else { [int]$cv[1] + $bumpMinor }
          $newPatch = if ($bumpMajor -gt 0 -or $bumpMinor -gt 0) { $bumpPatch } else { [int]$cv[2] + $bumpPatch }
          $newBase = "$newMajor.$newMinor.$newPatch"

          Write-Host "Version: $current -> $newBase (bump: $bump)"

          # Pull the latest branch tip BEFORE counting commits, so the baked commit-count
          # (and thus the version/tag/installer) matches the commit we push after building.
          # No local commits exist yet, so this is a fast-forward, not a real rebase.
          git pull --rebase
          # Compute full version
          $count = git rev-list --count HEAD
          # Add 1 to account for the stamp commit we'll make
          $count = [int]$count + 1
          $fullVersion = "$newBase.$count"
          echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_OUTPUT
          echo "BASE_VERSION=$newBase" >> $env:GITHUB_OUTPUT
          Write-Host "Full version: $fullVersion"

      - name: Stamp assembly version
        run: |
          $version = "${{ steps.version.outputs.FULL_VERSION }}"
          $file = "Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          Set-Content $file $content
          Write-Host "Stamped version: $version"

      - name: Stamp changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.FULL_VERSION }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $content = Get-Content CHANGELOG.md -Raw
          $content = $content -replace '## Unreleased', "## Unreleased`n`n## v$version - $date"
          Set-Content -Path CHANGELOG.md -Value $content -NoNewline
          Write-Host "Stamped changelog for v$version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # The MCP server is net10.0-windows; the windows-2022 image does not carry that SDK.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Import signing certificate
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          $pfxPath = Join-Path $env:RUNNER_TEMP "OutlookAI.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My
          Remove-Item $pfxPath
          Write-Host "Imported certificate: $($cert.Thumbprint)"
          # Fail if the signing cert has expired; warn as it approaches expiry.
          $daysLeft = [int]($cert.NotAfter - (Get-Date)).TotalDays
          if ($daysLeft -lt 0) {
            Write-Error "::error::Signing certificate EXPIRED on $($cert.NotAfter). Renew before releasing."
            exit 1
          } elseif ($daysLeft -lt 30) {
            Write-Warning "::warning::Signing certificate expires in $daysLeft days (on $($cert.NotAfter))."
          } else {
            Write-Host "Signing certificate valid for $daysLeft more days (expires $($cert.NotAfter))."
          }

      - name: Build and Publish
        run: >
          msbuild OutlookAI.csproj
          /target:Publish
          /p:Configuration=Release
          /p:ApplicationVersion=${{ steps.version.outputs.FULL_VERSION }}
          /p:PublishDir=publish\
          /p:BootstrapperEnabled=true
          /p:IsWebBootstrapper=false
          /p:DefineConstants="VSTO40%3BTRACE"

      # Must run AFTER the msbuild publish above (which owns publish\) and BEFORE the
      # installer is compiled, so the payload is inside the tree Installer.iss packages.
      # Framework-dependent on purpose (v3.MD Phase 8, user decision): self-contained would
      # add ~70 MB and blow past the updater's hard 50 MB download cap. The required
      # prerequisite is the BASE .NET 10 runtime (Microsoft.NETCore.App) - the server
      # references no WinForms/WPF, so the Desktop runtime is not needed; the installer
      # detects and installs it the same way it already does for .NET 4.8 and VSTO.
      # /p:Version gives the server the SAME FULL_VERSION as the add-in (R11: one app, one
      # version); local dev builds keep the 99.99.99.0 default from Directory.Build.props.
      - name: Publish MCP server
        shell: pwsh
        run: |
          dotnet publish McpServer/OutlookAI.McpServer/OutlookAI.McpServer.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:Version=${{ steps.version.outputs.FULL_VERSION }} `
            -o publish\McpServer
          $exe = "publish\McpServer\OutlookAI.McpServer.exe"
          if (-not (Test-Path $exe)) { Write-Error "MCP server publish produced no executable"; exit 1 }
          $stamped = (Get-Item $exe).VersionInfo.FileVersion
          if ($stamped -ne "${{ steps.version.outputs.FULL_VERSION }}") {
            Write-Error "MCP server stamped $stamped, expected ${{ steps.version.outputs.FULL_VERSION }}"
            exit 1
          }
          $mb = [math]::Round((Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "MCP server published at $stamped; total uncompressed payload ${mb} MB"

      - name: Export signing certificate as .cer
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { Write-Error "No signing certificate found"; exit 1 }
          Export-Certificate -Cert $cert -FilePath publish\OutlookAI.cer -Type CERT
          Write-Host "Exported certificate: $($cert.Subject) ($($cert.Thumbprint))"

      - name: Create installer
        shell: pwsh
        run: |
          iscc /DMyAppVersion=${{ steps.version.outputs.FULL_VERSION }} Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The shipped auto-updater refuses any release asset larger than 50 MB
          # (UpdateService.maxDownloadBytes) and would silently stop updating every
          # installed copy. Fail the release here instead, while it is still fixable.
          $exe = Get-Item "OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Installer size: ${mb} MB"
          if ($exe.Length -gt 50MB) {
            Write-Error "Installer is ${mb} MB, over the auto-updater's 50 MB download cap. Raise UpdateService.maxDownloadBytes and ship that first."
            exit 1
          }

      - name: Sign installer
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          $exe = "OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe"
          # Try multiple RFC-3161 timestamp servers so a single server outage doesn't fail the release.
          $tsServers = @(
            'http://timestamp.digicert.com',
            'http://timestamp.sectigo.com'
          )
          $signed = $false
          foreach ($ts in $tsServers) {
            Write-Host "Signing with timestamp server $ts"
            & $signtool.FullName sign /a /fd SHA256 /tr $ts /td SHA256 $exe
            if ($LASTEXITCODE -eq 0) { $signed = $true; break }
            Write-Warning "Timestamp server $ts failed (exit $LASTEXITCODE); trying next..."
            Start-Sleep -Seconds 5
          }
          if (-not $signed) { Write-Error "All timestamp servers failed"; exit 1 }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OutlookAI-installer
          path: OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe
          if-no-files-found: error

      - name: Commit stamped changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git checkout -- Properties/AssemblyInfo.cs
          # No post-build rebase: the version/tag/artifact were computed from the tip we
          # pulled earlier, so we push that exact commit. If master advanced during the
          # build, this push is rejected and the job fails (the release step is skipped) -
          # safer than rebasing and shipping a version that no longer matches HEAD.
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Release v${{ steps.version.outputs.FULL_VERSION }}" && git push)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${{ steps.version.outputs.FULL_VERSION }}"
          "OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe"
          --target "${{ github.ref_name }}"
          --title "OutlookAI v${{ steps.version.outputs.FULL_VERSION }}"
          --notes-file release_notes.txt

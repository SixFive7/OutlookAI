name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump as major.minor.patch (e.g. 0.0.0 for no change, 1.0.0 for major, 0.1.0 for minor, 0.0.1 for patch)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version bump input
        shell: pwsh
        run: |
          $bump = "${{ inputs.version_bump }}"
          if ($bump -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid version_bump format '$bump'. Must be major.minor.patch (e.g. 1.0.0, 0.1.0, 0.0.1)"
            exit 1
          }
          if ($bump -eq '0.0.0') {
            Write-Error "Version bump 0.0.0 is not valid. Every release must bump at least the patch version (e.g. 0.0.1)."
            exit 1
          }

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match '(?s)## Unreleased\r?\n(.*?)(?=\r?\n## |\z)') {
            $notes = $Matches[1].Trim()
          } else {
            $notes = ""
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "No entries under '## Unreleased' in CHANGELOG.md. Add release notes before creating a release."
            exit 1
          }
          Set-Content -Path release_notes.txt -Value $notes
          Write-Host "Release notes:`n$notes"

      - name: Apply version bump
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bump = "${{ inputs.version_bump }}"
          $parts = $bump -split '\.'
          $bumpMajor = [int]$parts[0]
          $bumpMinor = [int]$parts[1]
          $bumpPatch = [int]$parts[2]

          # Get current base version from the latest GitHub release tag
          $tag = gh release view --json tagName -q .tagName 2>$null
          if ($tag -match '^v?(\d+\.\d+\.\d+)') {
            $current = $Matches[1]
          } else {
            $current = "0.0.0"
          }
          $cv = $current -split '\.'
          $newMajor = [int]$cv[0] + $bumpMajor
          $newMinor = [int]$cv[1] + $bumpMinor
          $newPatch = [int]$cv[2] + $bumpPatch
          $newBase = "$newMajor.$newMinor.$newPatch"

          Write-Host "Version: $current -> $newBase (bump: $bump)"

          # Compute full version
          $count = git rev-list --count HEAD
          # Add 1 to account for the stamp commit we'll make
          $count = [int]$count + 1
          $fullVersion = "$newBase.$count"
          echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_OUTPUT
          echo "BASE_VERSION=$newBase" >> $env:GITHUB_OUTPUT
          Write-Host "Full version: $fullVersion"

      - name: Stamp assembly version
        run: |
          $version = "${{ steps.version.outputs.FULL_VERSION }}"
          $file = "Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          Set-Content $file $content
          Write-Host "Stamped version: $version"

      - name: Stamp changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.FULL_VERSION }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $content = Get-Content CHANGELOG.md -Raw
          $content = $content -replace '## Unreleased', "## Unreleased`n`n## v$version - $date"
          Set-Content -Path CHANGELOG.md -Value $content -NoNewline
          Write-Host "Stamped changelog for v$version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Import signing certificate
        run: |
          $cert = Import-PfxCertificate -FilePath OutlookAI.pfx -CertStoreLocation Cert:\CurrentUser\My
          Write-Host "Imported certificate: $($cert.Thumbprint)"

      - name: Restore packages
        run: nuget restore OutlookAI.csproj

      - name: Build and Publish
        run: >
          msbuild OutlookAI.csproj
          /target:Publish
          /p:Configuration=Release
          /p:ApplicationVersion=${{ steps.version.outputs.FULL_VERSION }}
          /p:PublishDir=publish\
          /p:BootstrapperEnabled=true
          /p:IsWebBootstrapper=false
          /p:DefineConstants="VSTO40%3BTRACE%3BUseOfficeInterop"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.FULL_VERSION }} installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.FULL_VERSION }}
          name: OutlookAI v${{ steps.version.outputs.FULL_VERSION }}
          body_path: release_notes.txt
          files: OutlookAI-v${{ steps.version.outputs.FULL_VERSION }}.exe

      - name: Commit stamped changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Release v${{ steps.version.outputs.FULL_VERSION }}" && git push)

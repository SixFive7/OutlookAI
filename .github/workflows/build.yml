name: Build

# Compile-only validation so broken builds are caught on pull requests before a
# release is cut. Does not sign, publish, or create a release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Values that genuinely exist twice because the two sides are written in languages
      # that cannot see each other - C# and MSBuild XML, C# and Inno Setup's Pascal, C# and
      # a workflow step. First step in the job: it needs no toolchain and takes a second,
      # and the thing it catches (a signing thumbprint rotated on one side only) otherwise
      # fails closed and silently on every user's machine.
      - name: Check pinned cross-file constants
        shell: pwsh
        run: .github/scripts/check-pinned-constants.ps1

      # Measurement baselines are machine-local by policy: they are statistics about one
      # maintainer's machine, meaningful only against that machine's own history, and this
      # repository is public. The gate itself refuses to write inside a git working tree, and
      # .gitignore covers the shapes - this is the third line, and the only one that fails a
      # build when the first two are bypassed (a force-add, a rename, a redirected store).
      - name: Check no measurement data was committed
        shell: pwsh
        run: .github/scripts/check-measurement-privacy.ps1

      # The live-tier test VM can only be rebuilt from what this repository contains, and three
      # times in one week material a document depended on turned out to live only in a scratch
      # directory that was then cleared. This asks the tree the one question that catches it: does
      # the thing the document names exist here? It also pins the corpus parameters across the
      # three files that hold them, and refuses a credential-shaped literal under Testbed/ - a
      # guest password has been committed to this public repository once already.
      - name: Check testbed references and parameters
        shell: pwsh
        run: .github/scripts/check-testbed-references.ps1

      # Every script here must run on the Windows PowerShell 5.1 that ships with Windows - the only
      # PowerShell the test guests have (decided 2026-09-24, Q78). Three 5.1-only failures reached
      # the tree while everything ran under pwsh 7: a param() default built from $PSScriptRoot, a
      # non-ASCII character in a file with no BOM, and a native program's redirected stderr under
      # 'Stop'. This fails on all three, statically, in every script.
      - name: Check scripts run on Windows PowerShell 5.1
        shell: pwsh
        run: .github/scripts/check-powershell-51.ps1

      # The same guards again, run BY Windows PowerShell 5.1. A static check cannot prove a script
      # runs on 5.1; running it there does, and it is what stops the next 5.1-only failure passing
      # every pwsh step the way the last three did. Each guard gets its own process and -File - the
      # mode the $PSScriptRoot failure needs - so one failing guard cannot hide another. Here
      # check-powershell-51.ps1 also parses every script with 5.1's own parser, which is what
      # catches PowerShell 7-only syntax, and check-measurement-privacy.ps1 runs the measurement
      # gate's self-test under the same 5.1, so the gate is covered too.
      - name: Run every guard under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "::error::This step exists to run the guards under Windows PowerShell 5.1, and it is running under $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
            exit 1
          }
          $shellExe = Join-Path $PSHOME 'powershell.exe'
          $guards = @(Get-ChildItem -Path .github/scripts -Filter 'check-*.ps1' -File | Sort-Object Name)
          if ($guards.Count -eq 0) {
            Write-Host '::error::Found no check-*.ps1 guard under .github/scripts, so this step would prove nothing.'
            exit 1
          }
          $failed = @()
          foreach ($guard in $guards) {
            Write-Host ''
            Write-Host "=== $($guard.Name) under Windows PowerShell $($PSVersionTable.PSVersion)"
            & $shellExe -NoProfile -ExecutionPolicy Bypass -File $guard.FullName
            if ($LASTEXITCODE -ne 0) { $failed += "$($guard.Name) (exit $LASTEXITCODE)" }
          }
          Write-Host ''
          if ($failed.Count -gt 0) {
            Write-Host "::error::Failed under Windows PowerShell $($PSVersionTable.PSVersion): $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($guards.Count) guards pass under Windows PowerShell $($PSVersionTable.PSVersion)."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Generate temporary signing certificate
        shell: pwsh
        # VSTO requires ClickOnce manifest signing to be enabled AND the cert present in
        # the store; it cannot be disabled. Use a throwaway self-signed cert so this gate
        # validates the full build without needing the real signing secret.
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=OutlookAI CI Build" -CertStoreLocation Cert:\CurrentUser\My
          "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        run: msbuild OutlookAI.csproj /p:Configuration=Release /p:TreatWarningsAsErrors=true /p:ManifestCertificateThumbprint=${{ env.SIGN_THUMBPRINT }} /p:DefineConstants="VSTO40%3BTRACE"

      - name: Validate installer script
        shell: pwsh
        # Compile installer.iss so a script error is caught here instead of mid-release.
        # Also confirms iscc is present on the runner image (the installer step relies on
        # it being preinstalled). [Files] needs publish\ to exist; a placeholder suffices
        # for a syntax check.
        #
        # Redist\vstor_redist.exe gets a placeholder for the same reason. The real 40 MB
        # VSTO runtime is not in git (see .gitignore) and only release.yml fetches it -
        # this gate checks that the script compiles, not that the payload is genuine, and
        # downloading 40 MB on every pull request would be a waste. The consequence is that
        # the installer this step produces is NOT installable; it is never published.
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Set-Content publish\placeholder.txt "placeholder"
          New-Item -ItemType Directory -Force Redist | Out-Null
          Set-Content Redist\vstor_redist.exe "placeholder"
          iscc /DMyAppVersion=0.0.0.1 /O"$env:RUNNER_TEMP\issout" installer.iss

  dependency-review:
    # Flags known-vulnerable or disallowed-license dependencies introduced by a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0

name: Build

# Compile-only validation so broken builds are caught on pull requests before a
# release is cut. Does not sign, publish, or create a release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        # Compile-only gate: disable ClickOnce/Office manifest signing so this check
        # doesn't need the signing certificate (the release workflow still signs).
        run: msbuild OutlookAI.csproj /p:Configuration=Release /p:SignManifests=false /p:DefineConstants="VSTO40%3BTRACE"

  dependency-review:
    # Flags known-vulnerable or disallowed-license dependencies introduced by a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
